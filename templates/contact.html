{% extends 'base.html' %}

{% block content %}
<div class="contact-container" style="max-width: 600px; margin: 0 auto;">
    <div class="card">
        <h2 style="margin-bottom: 8px;">Get in Touch</h2>
        <p style="color: #666; margin-bottom: 24px;">Have a question or need assistance? Send us a message.</p>

        <form action="{{ url_for('contact') }}" method="POST">
            <div style="margin-bottom: 16px;">
                <label for="customer_name" style="font-weight: bold; font-size: 14px;">Full Name</label>
                <input type="text" id="customer_name" name="customer_name" required>
            </div>
            
            <div style="margin-bottom: 16px;">
                <label for="email" style="font-weight: bold; font-size: 14px;">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div style="margin-bottom: 16px;">
                <label for="subject" style="font-weight: bold; font-size: 14px;">Subject</label>
                <input type="text" id="subject" name="subject" required>
            </div>
            
            <div style="margin-bottom: 24px;">
                <label for="message" style="font-weight: bold; font-size: 14px;">Message</label>
                <textarea id="message" name="message" rows="5" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: var(--radius-control); font-family: inherit; resize: vertical;"></textarea>
            </div>
            
            <button type="submit" class="btn-primary" style="width: 100%;">Send Message</button>
        </form>
    </div>
</div>
{% endblock %}
