{% extends 'base.html' %}
{% block content %}
<div class="admin-container" style="max-width: 800px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <h2>Add New Flight</h2>
        <a href="{{ url_for('admin_dashboard') }}" style="color: var(--aviation-blue);">Back to Dashboard</a>
    </div>
    
    <div class="card">
        <form action="{{ url_for('add_flight') }}" method="POST">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px;">
                <div>
                    <label style="font-weight: bold; font-size: 14px;">Flight Number</label>
                    <input type="text" name="flight_number" required placeholder="e.g., SL400">
                </div>
                <div>
                    <label style="font-weight: bold; font-size: 14px;">Airline Name</label>
                    <input type="text" name="airline_name" value="SkyLink Airlines" required>
                </div>
                <div>
                    <label style="font-weight: bold; font-size: 14px;">Departure City</label>
                    <input type="text" name="departure_city" required placeholder="e.g., Nairobi (NBO)">
                </div>
                <div>
                    <label style="font-weight: bold; font-size: 14px;">Destination City</label>
                    <input type="text" name="destination_city" required placeholder="e.g., Eldoret (EDL)">
                </div>
                <div>
                    <label style="font-weight: bold; font-size: 14px;">Departure Date</label>
                    <input type="date" name="departure_date" required>
                </div>
                <div>
                    <label style="font-weight: bold; font-size: 14px;">Travel Class</label>
                    <select name="travel_class" required>
                        <option value="Economy">Economy</option>
                        <option value="Business">Business</option>
                    </select>
                </div>
                <div>
                    <label style="font-weight: bold; font-size: 14px;">Departure Time</label>
                    <input type="time" name="departure_time" required>
                </div>
                <div>
                    <label style="font-weight: bold; font-size: 14px;">Arrival Time</label>
                    <input type="time" name="arrival_time" required>
                </div>
                <div>
                    <label style="font-weight: bold; font-size: 14px;">Ticket Price (KSh)</label>
                    <input type="number" name="ticket_price" step="0.01" required>
                </div>
                <div>
                    <label style="font-weight: bold; font-size: 14px;">Total Seats</label>
                    <input type="number" name="total_seats" required>
                </div>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%;">Save Flight</button>
        </form>
    </div>
</div>
{% endblock %}
